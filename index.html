<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ရွှေဖူးသစ် Nail Studio - ဝင်ငွေထွက်ငွေစာရင်း</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-pink-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">ရွှေဖူးသစ် Nail Studio ဝင်ငွေထွက်ငွေစာရင်း</h1>
            </div>
            <!-- Live Clock -->
            <div id="liveClock" class="bg-pink-700 px-4 py-1 rounded-full text-sm font-semibold tracking-wide shadow-inner">
                --:--:--
            </div>
        </div>
    </header>

    <!-- Navigation Buttons -->
    <main class="max-w-4xl mx-auto p-4">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
            <button onclick="showSection('income')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-wallet"></i> ဝင်ငွေ
            </button>
            <button onclick="showSection('general_expense')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-receipt"></i> အထွေထွေအသုံးစရိတ်
            </button>
            <button onclick="showSection('supply_expense')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-boxes-packing"></i> ဆိုင်ပစ္စည်းဝယ် စရိတ်
            </button>
            <button onclick="showSection('electricity')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-bolt"></i> မီတာဖိုး
            </button>
            <button onclick="showSection('debt_check')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-hand-holding-dollar"></i> အကြွေးမှီး
            </button>
            <button onclick="showSection('summary')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold p-3 rounded-xl shadow flex items-center justify-center gap-2 transition col-span-2 md:col-span-1">
                <i class="fa-solid fa-chart-pie"></i> စာရင်းချုပ်ကြည့်ရန်
            </button>
        </div>

        <!-- Dynamic Content Sections -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
            
            <!-- 1. ဝင်ငွေ (Income) -->
            <div id="sec-income" class="section-block">
                <h2 class="text-xl font-bold text-emerald-600 mb-4 border-b pb-2"><i class="fa-solid fa-money-bill-wave"></i> ဝင်ငွေထည့်သွင်းရန်</h2>
                <p class="text-sm text-slate-500 mb-3">ငွေစက္ကူများကို နှိပ်၍ ပမာဏပေါင်းပါ-</p>
                
                <!-- Kyat Note Buttons -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                    <button onclick="addCash(50)" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold py-3 rounded-lg shadow-sm">၅၀ တန်</button>
                    <button onclick="addCash(100)" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold py-3 rounded-lg shadow-sm">၁၀၀ တန်</button>
                    <button onclick="addCash(200)" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold py-3 rounded-lg shadow-sm">၂၀၀ တန်</button>
                    <button onclick="addCash(500)" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold py-3 rounded-lg shadow-sm">၅၀၀ တန်</button>
                    <button onclick="addCash(1000)" class="bg-emerald-100 hover:bg-emerald-200 border border-emerald-400 text-emerald-900 font-bold py-3 rounded-lg shadow-sm">၁၀၀၀ တန်</button>
                    <button onclick="addCash(5000)" class="bg-emerald-200 hover:bg-emerald-300 border border-emerald-500 text-emerald-900 font-bold py-3 rounded-lg shadow-sm">၅၀၀၀ တန်</button>
                    <button onclick="addCash(10000)" class="bg-emerald-300 hover:bg-emerald-400 border border-emerald-600 text-emerald-950 font-bold py-3 rounded-lg shadow-sm col-span-2">၁၀၀၀၀ တန်</button>
                </div>

                <div class="flex items-center gap-2 mb-4">
                    <input type="number" id="incomeAmount" placeholder="စုစုပေါင်းပမာဏ" class="w-full border rounded-lg p-3 text-lg font-bold text-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500" value="0">
                    <button onclick="resetCash()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-3 rounded-lg font-semibold">ပြန်စမည်</button>
                </div>

                <button onclick="saveIncome()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                    ပိုက်ဆံသိမ်းမည်
                </button>
            </div>

            <!-- 2. အထွေထွေအသုံးစရိတ် (General Expense) -->
            <div id="sec-general_expense" class="section-block hidden">
                <h2 class="text-xl font-bold text-rose-600 mb-4 border-b pb-2"><i class="fa-solid fa-receipt"></i> အထွေထွေအသုံးစရိတ်</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">အကြောင်းအရာ</label>
                        <input type="text" id="genDesc" placeholder="ဥပမာ - ထမင်းဖိုး၊ သောက်ရေသန့်" class="w-full border rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">ပမာဏ (ကျပ်)</label>
                        <input type="number" id="genAmount" placeholder="0" class="w-full border rounded-lg p-2.5">
                    </div>
                    <button onclick="saveGeneralExpense()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                        ထုတ်မည် 😭
